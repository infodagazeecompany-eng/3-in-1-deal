<!-- TikTok Purchase: ONLY on the Thank You URL, once per browser session -->
<script>
(function () {
  var key = "tiktok_purchase_fired_v1";
  function firePurchaseOnce() {
    var isThankYou = new URLSearchParams(window.location.search).get("thank-you") === "1";
    if (!isThankYou || window.__purchaseFiredThisPage) return;
    if (sessionStorage.getItem(key) === "1") return;
    if (typeof ttq === "undefined" || typeof ttq.track !== "function") return;

    window.__purchaseFiredThisPage = true;
    sessionStorage.setItem(key, "1");

    ttq.track("Purchase", {
      contents: [{ content_id: "3-in-1-beauty-deal", content_type: "product", quantity: 1 }],
      content_type: "product",
      value: 2000,
      currency: "PKR"
    });
  }

  window.addEventListener("load", function () {
    setTimeout(firePurchaseOnce, 300);
  });
})();
</script>
